<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="한끼로그 — 내 조건에 맞는 점심을 찾고, 확인한 식사를 기록하세요."
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="refresh" content="2; url=https://caiorie.vercel.app" />
    <title>한끼로그 · cAIorie</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="canonical" href="https://caiorie.vercel.app" />
    <style>
      :root {
        color-scheme: light;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: #f5f8f4;
        color: #173e34;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        max-width: 540px;
        width: 100%;
        padding: clamp(28px, 7vw, 56px);
        background: #fff;
        border: 1px solid #dee8dd;
        border-radius: 24px;
      }
      img {
        width: 56px;
        height: 56px;
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        color: #64816f;
        margin: 24px 0 8px;
      }
      h1 {
        font-size: clamp(28px, 7vw, 40px);
        line-height: 1.25;
        letter-spacing: -0.04em;
        margin: 0 0 20px;
      }
      p {
        font-size: 16px;
        line-height: 1.8;
        word-break: keep-all;
      }
      .button {
        display: block;
        padding: 16px 24px;
        margin: 28px 0 16px;
        border-radius: 12px;
        background: #1d5945;
        color: white;
        font-weight: 700;
        text-align: center;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #99bf42;
        outline-offset: 4px;
      }
      .note {
        font-size: 13px;
        color: #63766b;
      }
      footer {
        border-top: 1px solid #e4ece3;
        margin-top: 28px;
        padding-top: 20px;
        font-size: 13px;
      }
      footer a {
        color: #245942;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./favicon.svg" width="56" height="56" alt="" />
      <p class="eyebrow">MY DAILY LUNCH</p>
      <h1>나에게 맞는 한 끼,<br />한끼로그</h1>
      <p>
        내 조건에 맞는 점심을 살펴보고,<br />실제로 먹은 식사를 기록해 보세요.
      </p>
      <a class="button" href="https://caiorie.vercel.app">한끼로그 열기 ↗</a>
      <p class="note">
        잠시 후 공개 앱으로 이동합니다.<br />자동으로 이동하지 않으면 위 버튼을
        눌러 주세요.
      </p>
      <footer>
        <a href="https://github.com/mjayj9/cAIorie">소스 코드 · GitHub</a> ·
        AGPL-3.0
      </footer>
    </main>
  </body>
</html>
